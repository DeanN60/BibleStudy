<div class="book-container" appOpenTrigger>
  <div class="book-reference">{{ data().reference }}</div>
  <div class="book-block" appKeepInViewport>
    <div class="book-reference">
    {{ data().reference }}
    </div>
    <div class="book-content">
      {{ data().text }}
    </div>
    <div class="book-source">
      {{ data().source }}
    </div>
  </div>
</div>
