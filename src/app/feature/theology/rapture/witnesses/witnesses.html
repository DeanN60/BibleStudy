      The rapture of the two Witnesses
    </p>

    <p>
      <app-verse [data]="rev_11_11_12"/>
      During the end-times events in Revelation, two prophetic witnesses are killed in Jerusalem. After 3½
      days, God restores them to life, and a voice from heaven commands, "Come up here," after which they ascend to
      heaven in a cloud.
