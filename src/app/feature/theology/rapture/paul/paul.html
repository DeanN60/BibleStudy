    <p>
      The rapture of Paul
    </p>

    <p>
      <app-verse [data]="iiCor_12_2_4"/>
      Paul describes a personal experience where he was "caught up to the third heaven" (Paradise). He
      noted that he was unsure whether he was transported in the body or in the spirit.
    </p>

    <p>
      In this passage, we do not see any visible translation.
      Paul alludes to this being his experience.
    </p>
